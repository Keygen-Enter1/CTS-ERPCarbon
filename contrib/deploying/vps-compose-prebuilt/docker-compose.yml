# Carbon VPS — Docker Compose (prebuilt images only).
# Build ERP/MES/bootstrap locally, push to a registry, set CARBON_IMAGE_* in .env.
# Server: git clone + ./deploy-server.sh (no docker build on the VPS).
#
# Config bind-mounts still need CARBON_REPO (full repo checkout on the host).

x-shim: &shim
  type: bind
  source: ${CARBON_REPO}/contrib/deploying/simple-docker-caddy/bin/secrets-entrypoint.sh
  target: /usr/local/bin/carbon-secrets-entrypoint.sh
  read_only: true

services:
  # ─────────────────────────────── Apps ──────────────────────────────────────
  erp:
    image: ${CARBON_IMAGE_ERP:-carbon/erp:latest}
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["pnpm", "run", "start"]
    networks: [internal]
    secrets:
      - postgres_password
      - jwt_secret
      - anon_key
      - service_role_key
      - session_secret
      - inngest_signing_key
      - inngest_event_key
      - resend_api_key
      - smtp_password
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: UTC
      CARBON_EDITION: ${CARBON_EDITION:-community}
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-email,google,azure}
      DOMAIN: ${DOMAIN}
      APP_URL: ${ERP_URL}
      ERP_URL: ${ERP_URL}
      MES_URL: ${MES_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      # Browser uses SUPABASE_URL; server-side Supabase client uses INTERNAL (Docker DNS).
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
      SUPABASE_ANON_KEY: __ANON_KEY__
      SUPABASE_SERVICE_ROLE_KEY: __SERVICE_ROLE_KEY__
      SUPABASE_JWT_SECRET: __JWT_SECRET__
      SUPABASE_DB_URL: postgresql://postgres:__POSTGRES_PASSWORD__@postgres:5432/postgres?sslmode=disable
      REDIS_URL: redis://redis:6379
      RATE_LIMIT: ${RATE_LIMIT:-10}
      SESSION_SECRET: __SESSION_SECRET__
      INNGEST_SIGNING_KEY: __INNGEST_SIGNING_KEY__
      INNGEST_EVENT_KEY: __INNGEST_EVENT_KEY__
      INNGEST_EVENT_API_BASE_URL: ${INNGEST_EVENT_API_BASE_URL:-http://inngest:8288/}
      INNGEST_SERVE_HOST: ${INNGEST_SERVE_HOST:-}
      RESEND_API_KEY: __RESEND_API_KEY__
      SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      SMTP_USER: ${GOTRUE_SMTP_USER:-}
      SMTP_PASSWORD: __SMTP_PASSWORD__
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - *shim
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  mes:
    image: ${CARBON_IMAGE_MES:-carbon/mes:latest}
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["pnpm", "run", "start"]
    networks: [internal]
    secrets:
      - postgres_password
      - jwt_secret
      - anon_key
      - service_role_key
      - session_secret
      - inngest_signing_key
      - inngest_event_key
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: UTC
      CARBON_EDITION: ${CARBON_EDITION:-community}
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-email,google,azure}
      DOMAIN: ${DOMAIN}
      APP_URL: ${MES_URL}
      ERP_URL: ${ERP_URL}
      MES_URL: ${MES_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
      SUPABASE_ANON_KEY: __ANON_KEY__
      SUPABASE_SERVICE_ROLE_KEY: __SERVICE_ROLE_KEY__
      SUPABASE_JWT_SECRET: __JWT_SECRET__
      SUPABASE_DB_URL: postgresql://postgres:__POSTGRES_PASSWORD__@postgres:5432/postgres?sslmode=disable
      REDIS_URL: redis://redis:6379
      RATE_LIMIT: ${RATE_LIMIT:-10}
      SESSION_SECRET: __SESSION_SECRET__
      INNGEST_SIGNING_KEY: __INNGEST_SIGNING_KEY__
      INNGEST_EVENT_KEY: __INNGEST_EVENT_KEY__
      INNGEST_EVENT_API_BASE_URL: ${INNGEST_EVENT_API_BASE_URL:-http://inngest:8288/}
      INNGEST_SERVE_HOST: ${INNGEST_SERVE_HOST:-}
    volumes:
      - *shim
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    networks: [internal]
    # Swarm ingress mesh (IPVS) needs seconds to converge after a (re)start, but
    # caddy fires ACME immediately — so with ingress the Let's Encrypt validator hits
    # :80 before it routes and gets "connection refused", failing every cert. host
    # mode makes the port live the instant caddy starts. Single-node, single-replica,
    # so there is no multi-node routing to lose.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ERP_HOST: ${ERP_HOST}
      MES_HOST: ${MES_HOST}
      SUPABASE_HOST: ${SUPABASE_HOST}
      STUDIO_HOST: ${STUDIO_HOST:-}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - type: bind
        source: ${CARBON_REPO}/contrib/deploying/simple-docker-caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # 127.0.0.1, NOT localhost: /etc/hosts resolves localhost to ::1 (IPv6) but
      # caddy's admin API listens on 127.0.0.1 only, and busybox wget won't fall
      # back — using localhost makes this check always fail and flaps caddy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ──────────────────────────── Data plane ───────────────────────────────────
  postgres:
    image: supabase/postgres:15.14.1.112
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    # Image's own entrypoint+cmd. Do NOT override shared_preload_libraries here:
    # the image's postgresql.conf already preloads the full set Carbon needs
    # (pg_stat_statements, pg_net, pg_cron, pgsodium, supabase_vault, …). Passing
    # -c shared_preload_libraries=… would REPLACE that list and break extensions
    # (e.g. the webhooks migration's `CREATE EXTENSION pg_net`).
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    networks:
      internal:
        aliases: [db]
    secrets:
      - postgres_password
      - jwt_secret
    environment:
      TZ: UTC
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: __POSTGRES_PASSWORD__
      PGPASSWORD: __POSTGRES_PASSWORD__
      JWT_SECRET: __JWT_SECRET__
      JWT_EXP: "3600"
      # Performance knobs consumed by 02-performance.sh (ALTER SYSTEM) on first init.
      CARBON_PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-100}
      CARBON_PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-512MB}
      CARBON_PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      CARBON_PG_WORK_MEM: ${PG_WORK_MEM:-8MB}
      CARBON_PG_MAINTENANCE_WORK_MEM: ${PG_MAINTENANCE_WORK_MEM:-128MB}
    volumes:
      - *shim
      - pgdata:/var/lib/postgresql/data
      - pgconfig:/etc/postgresql-custom
      - type: bind
        source: ${CARBON_REPO}/contrib/deploying/simple-docker-caddy/postgres/01-roles.sh
        target: /docker-entrypoint-initdb.d/zz-carbon-01-roles.sh
        read_only: true
      - type: bind
        source: ${CARBON_REPO}/contrib/deploying/simple-docker-caddy/postgres/02-performance.sh
        target: /docker-entrypoint-initdb.d/zz-carbon-02-performance.sh
        read_only: true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  gotrue:
    image: supabase/gotrue:v2.189.0
    # GoTrue image USER is non-root; Compose file secrets mount as root-only (0600).
    # carbon-secrets-entrypoint must read /run/secrets before exec — run as root.
    user: "0:0"
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["auth"]
    networks: [internal]
    secrets:
      - postgres_password
      - jwt_secret
      - smtp_password
      - saml_private_key
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:__POSTGRES_PASSWORD__@postgres:5432/postgres
      GOTRUE_SITE_URL: ${ERP_URL}
      GOTRUE_URI_ALLOW_LIST: ${ERP_URL},${ERP_URL}/callback,${MES_URL},${MES_URL}/callback
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-true}
      GOTRUE_JWT_SECRET: __JWT_SECRET__
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: __SMTP_PASSWORD__
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-Carbon}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI:-}
      GOTRUE_EXTERNAL_AZURE_ENABLED: ${AZURE_AUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${SUPABASE_AUTH_EXTERNAL_AZURE_REDIRECT_URI:-}
      GOTRUE_SAML_ENABLED: ${SAML_ENABLED:-false}
      # Swarm secret, not env interpolation — the SP private key must not be
      # readable via `docker inspect`. Placeholder until SAML is enabled; set it
      # with `deploy.sh secret saml_private_key "$(base64 -w0 < key.der)"`.
      GOTRUE_SAML_PRIVATE_KEY: __SAML_PRIVATE_KEY__
      # GoTrue runs inside Docker — fetch templates from ERP on the internal network
      # (public ERP_URL often hairpins and breaks magic-link / invite emails).
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://erp:3000/templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://erp:3000/templates/invite.html
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
    volumes:
      - *shim
    restart: unless-stopped
  postgrest:
    image: postgrest/postgrest:v13.0.8
    # PostgREST's image is FROM scratch (no shell), so it can't run the
    # secrets-entrypoint shim the other services use. Instead it reads each value
    # straight from its secret file via PostgREST's native @file syntax.
    # Non-root USER cannot read Compose file secrets (0600) — run as root.
    user: "0:0"
    networks: [internal]
    secrets:
      - postgrest_db_uri
      - jwt_secret
    environment:
      PGRST_DB_URI: "@/run/secrets/postgrest_db_uri"
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/run/secrets/jwt_secret"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: "@/run/secrets/jwt_secret"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    restart: unless-stopped
  realtime:
    image: supabase/realtime:v2.89.0
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["/usr/bin/tini", "-s", "-g", "--", "/app/run.sh", "/app/bin/server"]
    networks:
      internal:
        aliases: [realtime-dev]
    secrets:
      - postgres_password
      - jwt_secret
    environment:
      PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: __POSTGRES_PASSWORD__
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: __JWT_SECRET__
      METRICS_JWT_SECRET: __JWT_SECRET__
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
      APP_NAME: realtime
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    volumes:
      - *shim
    restart: unless-stopped
  storage:
    image: supabase/storage-api:v1.58.4
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["docker-entrypoint.sh", "node", "dist/start/server.js"]
    networks: [internal]
    secrets:
      - postgres_password
      - jwt_secret
      - anon_key
      - service_role_key
    environment:
      ANON_KEY: __ANON_KEY__
      SERVICE_KEY: __SERVICE_ROLE_KEY__
      POSTGREST_URL: http://postgrest:3000
      PGRST_JWT_SECRET: __JWT_SECRET__
      DATABASE_URL: postgres://supabase_storage_admin:__POSTGRES_PASSWORD__@postgres:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - *shim
      - storage:/var/lib/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  # Image transformations (resize + HEIC→JPEG decode) for the storage API.
  # Internal only — never publish a port: direct imgproxy access reads the
  # storage volume with no RLS.
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    networks: [internal]
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      # Default is 16.8Mpx, which rejects 48MP iPhone photos.
      IMGPROXY_MAX_SRC_RESOLUTION: "60"
    volumes:
      - storage:/var/lib/storage
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  meta:
    image: supabase/postgres-meta:v0.96.5
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["docker-entrypoint.sh", "node", "dist/server/server.js"]
    networks: [internal]
    secrets:
      - postgres_password
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: __POSTGRES_PASSWORD__
    volumes:
      - *shim
    restart: unless-stopped
  studio:
    image: supabase/studio:2026.04.28-sha-89d08a2
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["docker-entrypoint.sh", "node", "apps/studio/server.js"]
    networks: [internal]
    secrets:
      - postgres_password
      - anon_key
      - service_role_key
    environment:
      # Next.js standalone binds to $HOSTNAME, which Docker sets to the container ID
      # (→ the overlay IP only). Force 0.0.0.0 so it also listens on 127.0.0.1 for the
      # healthcheck and on the service VIP for kong/caddy.
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: __POSTGRES_PASSWORD__
      DEFAULT_ORGANIZATION_NAME: Carbon
      DEFAULT_PROJECT_NAME: Carbon
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: __ANON_KEY__
      SUPABASE_SERVICE_KEY: __SERVICE_ROLE_KEY__
      # Studio's SQL-editor snippets are read from a directory on disk; with the
      # var unset it throws "SNIPPETS_MANAGEMENT_FOLDER env var is not set" on
      # the SQL editor page. Studio creates the folder itself if missing.
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - *shim
    # The image's built-in healthcheck demands HTTP 200 from /api/platform/profile
    # with no start_period, which SIGKILLs a studio that is in fact serving. Override
    # with a lenient check (server answers at all) on 127.0.0.1 + a boot grace period.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/platform/profile').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Internal admin UI. Not published. Reach it via the optional studio.* route
    # in the Caddyfile (behind basic_auth) or an SSH tunnel — never expose openly.
    restart: unless-stopped
  edge-runtime:
    image: supabase/edge-runtime:v1.74.0
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command: ["edge-runtime", "start", "--main-service", "/home/deno/main"]
    networks: [internal]
    secrets:
      - postgres_password
      - jwt_secret
      - anon_key
      - service_role_key
    environment:
      TZ: UTC
      JWT_SECRET: __JWT_SECRET__
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: __ANON_KEY__
      SUPABASE_SERVICE_ROLE_KEY: __SERVICE_ROLE_KEY__
      VERIFY_JWT: ${EDGE_VERIFY_JWT:-true}
    volumes:
      - *shim
      - type: bind
        source: ${CARBON_REPO}/packages/database/supabase/functions
        target: /home/deno/functions
        read_only: true
      - type: bind
        source: ${CARBON_REPO}/packages/dev/docker/edge-main
        target: /home/deno/main
        read_only: true
    restart: unless-stopped
  kong:
    image: kong:2.8.1
    networks: [internal]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes:
      - type: bind
        source: ${CARBON_REPO}/packages/dev/docker/kong.yml
        target: /home/kong/kong.yml
        read_only: true
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks: [internal]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  inngest:
    image: inngest/inngest:v1.19.4
    entrypoint: ["/usr/local/bin/carbon-secrets-entrypoint.sh"]
    command:
      - inngest
      - start
      - --sqlite-dir
      - /data
      - --sdk-url
      - http://erp:3000/api/inngest
      - --sdk-url
      - http://mes:3000/api/inngest
    networks: [internal]
    secrets:
      - inngest_signing_key
      - inngest_event_key
    environment:
      INNGEST_EVENT_KEY: __INNGEST_EVENT_KEY__
      INNGEST_SIGNING_KEY: __INNGEST_SIGNING_KEY__
    volumes:
      - *shim
      - inngest:/data
    restart: unless-stopped

  migrate:
    profiles: [migrate]
    image: ${CARBON_IMAGE_BOOTSTRAP:-carbon/bootstrap:latest}
    networks: [internal]
    secrets:
      - postgres_password
    environment:
      PGSSLMODE: disable
    working_dir: /repo/packages/database
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        pnpm exec supabase migration up --include-all
        --db-url "postgresql://supabase_admin:$$(cat /run/secrets/postgres_password)@postgres:5432/postgres"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  pgconfig:
  storage:
  inngest:
  redis-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgrest_db_uri:
    file: ./secrets/postgrest_db_uri
  jwt_secret:
    file: ./secrets/jwt_secret
  anon_key:
    file: ./secrets/anon_key
  service_role_key:
    file: ./secrets/service_role_key
  session_secret:
