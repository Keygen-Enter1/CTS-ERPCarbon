# Reverse proxy on the VPS (nginx) — TLS certificates managed by your existing setup.
# Include from http {} or paste into sites-enabled after certbot / acme.
#
# Upstreams: Carbon Docker stack with docker-compose.smartsite.yml (127.0.0.1:30xxx)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── ERP ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name erpcarbon.smartsite.vn;

    # ssl_certificate ... (your cert paths)

    location / {
        proxy_pass http://127.0.0.1:30000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}

# ── MES ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name mescarbon.smartsite.vn;

    location / {
        proxy_pass http://127.0.0.1:30001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}

# ── Supabase API (REST, auth, storage, realtime, edge) ──────────────────────
server {
    listen 443 ssl http2;
    server_name apicarbon.smartsite.vn;

    location / {
        proxy_pass http://127.0.0.1:30003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        client_max_body_size 55m;
    }
}

# HTTP → HTTPS (optional)
server {
    listen 80;
    server_name erpcarbon.smartsite.vn mescarbon.smartsite.vn apicarbon.smartsite.vn;
    return 301 https://$host$request_uri;
}
